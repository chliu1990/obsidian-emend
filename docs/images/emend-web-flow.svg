<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="web-flow-title web-flow-desc">
  <title id="web-flow-title">Conceptual flow of opt-in DeepSeek Web research</title>
  <desc id="web-flow-desc">Web research is Off by default and limited to supported DeepSeek models in Chat or Chat Selection. Review pauses for editable retrieval arguments; Auto skips only that pause. Search or Fetch results pass through extraction and verification before the main answering model receives source metadata and exact-quote evidence. The terminal answer can include Sources and warnings. No step has a note writer, and unsupported configurations fail without unsearched fallback.</desc>
  <defs>
    <marker id="web-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#475569"/>
    </marker>
    <style>
      .title { font-size: 28px; font-weight: 700; font-family: system-ui, sans-serif; fill: #172033; }
      .subtitle { font-size: 16px; font-weight: 500; font-family: system-ui, sans-serif; fill: #475569; }
      .box-title { font-size: 17px; font-weight: 700; font-family: system-ui, sans-serif; fill: #172033; }
      .body { font-size: 15px; font-weight: 500; font-family: system-ui, sans-serif; fill: #334155; }
      .small { font-size: 14px; font-weight: 500; font-family: system-ui, sans-serif; fill: #475569; }
      .badge { font-size: 13px; font-weight: 700; font-family: system-ui, sans-serif; letter-spacing: .35px; }
      .arrow { stroke: #475569; stroke-width: 2; fill: none; }
      .arrowhead { fill: #475569; }
      .box { stroke-width: 2; rx: 12; }
    </style>
  </defs>
  <rect width="1200" height="1000" fill="#f8fafc"/>
  <text x="40" y="48" class="title">DeepSeek Web research — conceptual flow</text>
  <text x="40" y="78" class="subtitle">Explicit, read-only research in Chat or Chat Selection; retrieval is untrusted evidence, never an instruction.</text>

  <rect x="40" y="104" width="240" height="92" class="box" fill="#f1f5f9" stroke="#64748b"/>
  <text x="60" y="134" class="box-title">Default: Web Off</text>
  <text x="60" y="161" class="body">Ordinary streaming Chat</text>
  <text x="60" y="183" class="body">No retrieval or Web writer</text>

  <rect x="340" y="104" width="360" height="92" class="box" fill="#ffffff" stroke="#6366f1"/>
  <text x="360" y="134" class="box-title">Explicit opt-in + supported DeepSeek</text>
  <text x="360" y="161" class="body">deepseek-flash or deepseek-v4-pro</text>
  <text x="360" y="183" class="body">Chat / Chat Selection only</text>

  <rect x="760" y="104" width="400" height="92" class="box" fill="#fff7ed" stroke="#ea580c"/>
  <text x="780" y="134" class="box-title">Capability gate</text>
  <text x="780" y="161" class="body">Unsupported provider or model fails explicitly</text>
  <text x="780" y="183" class="body">No silent unsearched or provider fallback</text>

  <path d="M 520 196 L 520 228 L 600 228 L 600 250" class="arrow" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 594 246 L 600 256 L 606 246 Z" class="arrowhead"/>
  <rect x="400" y="266" width="400" height="92" class="box" fill="#eef2ff" stroke="#6366f1"/>
  <text x="420" y="296" class="box-title">Model may propose Search / Fetch arguments</text>
  <text x="420" y="323" class="body">Queries, URLs, and extraction goals derive</text>
  <text x="420" y="345" class="body">from the declared Chat context</text>

  <path d="M 600 358 L 600 382 L 290 382 L 290 400" class="arrow" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 284 396 L 290 406 L 296 396 Z" class="arrowhead"/>
  <path d="M 600 358 L 600 382 L 910 382 L 910 400" class="arrow" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 904 396 L 910 406 L 916 396 Z" class="arrowhead"/>
  <rect x="90" y="416" width="400" height="106" class="box" fill="#ffffff" stroke="#2563eb"/>
  <text x="110" y="446" class="box-title">Web Review</text>
  <text x="110" y="473" class="body">Pause for editable queries, URLs, and goals</text>
  <text x="110" y="496" class="body">Run consents; cancel aborts before retrieval</text>
  <text x="110" y="515" class="small">Draft label clears before Review opens</text>
  <rect x="710" y="416" width="400" height="106" class="box" fill="#ffffff" stroke="#2563eb"/>
  <text x="730" y="446" class="box-title">Web Auto</text>
  <text x="730" y="473" class="body">Skips only the editable Review pause</text>
  <text x="730" y="496" class="body">Same validation, extraction, evidence, and limits</text>
  <text x="730" y="515" class="small">Draft label clears before retrieval</text>

  <path d="M 290 522 L 290 546 L 600 546 L 600 574" class="arrow" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 910 522 L 910 546 L 600 546" class="arrow" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 594 570 L 600 580 L 606 570 Z" class="arrowhead"/>
  <rect x="400" y="580" width="400" height="90" class="box" fill="#eef2ff" stroke="#6366f1"/>
  <text x="420" y="610" class="box-title">Search / Fetch retrieval</text>
  <text x="420" y="637" class="body">Bounded calls; a transient failure may retry once</text>
  <text x="420" y="660" class="body">Retrieval remains untrusted data</text>

  <path d="M 600 670 L 600 704" class="arrow" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 594 700 L 600 710 L 606 700 Z" class="arrowhead"/>
  <rect x="400" y="710" width="400" height="100" class="box" fill="#eef2ff" stroke="#6366f1"/>
  <text x="420" y="740" class="box-title">Extraction + verification</text>
  <text x="420" y="767" class="body">Source metadata + verified claims with exact quotes,</text>
  <text x="420" y="790" class="body">or quotes only; raw pages stay out of the answer model</text>

  <path d="M 600 810 L 600 844" class="arrow" stroke="#475569" stroke-width="2" fill="none"/>
  <path d="M 594 840 L 600 850 L 606 840 Z" class="arrowhead"/>
  <rect x="400" y="850" width="400" height="100" class="box" fill="#ecfdf5" stroke="#059669"/>
  <text x="420" y="880" class="box-title">Main model → terminal answer</text>
  <text x="420" y="907" class="body">Ready once, without draft label; Sources + warnings</text>
  <text x="420" y="930" class="body">Zero-tool terminal answers are allowed</text>

  <rect x="40" y="962" width="1120" height="30" rx="15" fill="#fee2e2"/>
  <text x="600" y="983" text-anchor="middle" class="badge" fill="#991b1b">NO NOTE WRITER AT ANY STEP · RETRIEVAL IS READ-ONLY DATA · THE NOTE REMAINS UNCHANGED</text>
</svg>
